services:
  - type: web
    name: pothole-detector
    env: python
    plan: free
    pythonVersion: "3.11.9"
    buildCommand: curl https://sh.rustup.rs -sSf | sh -s -- -y && export PATH="$HOME/.cargo/bin:$PATH" && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: TZ
        value: Asia/Manila
