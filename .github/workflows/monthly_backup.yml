name: Monthly Full Backup

on:
  schedule:
    # Run monthly on the 1st at 12:00 AM PST (08:00 UTC = 00:00 PST/UTC-8)
    - cron: '0 8 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Monthly Backup
        run: |
          curl --fail -X POST \
            -H "X-Backup-Api-Key: ${{ secrets.BACKUP_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"type":"monthly"}' \
            ${{ secrets.APP_BASE_URL }}/api/backups/scheduled
